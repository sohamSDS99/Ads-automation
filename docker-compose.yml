# ---------------------------------------------------------------------------
# Local mirror of the Railway topology (PRD §5.2). Five services, same shapes,
# same env-var names. Only VALUES differ between here and production — there is
# no `if RAILWAY` branch anywhere in application code.
#
#   web       the only service with a published host port (Railway: the only
#             service with a public domain)
#   api       internal only; uvicorn bound to `::`
#   worker    internal only; owns the storage volume
#   postgres  self-managed pgvector container, not a managed DB add-on
#   redis     sessions, arq queue, run locks
#
# The network enables IPv6 on purpose: Railway's private network is IPv6-only,
# so services must be reachable over IPv6 here too or local dev would not
# exercise the same code path.
# ---------------------------------------------------------------------------
name: ads-research-agent

x-api-env: &api-env
  DATABASE_URL: postgresql://agent:agent@postgres:5432/agent
  REDIS_URL: redis://redis:6379/0
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-ZGV2LW9ubHkta2V5LWRvLW5vdC11c2UtaW4tcHJvZCE=}
  FILE_TOKEN_SECRET: ${FILE_TOKEN_SECRET:-ZGV2LW9ubHktZmlsZS10b2tlbi1zZWNyZXQtMzJieXQ=}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-ara_session}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-me-at-least-12-chars}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  STORAGE_DIR: /data
  WORKER_INTERNAL_URL: http://worker:8081
  MAX_RUN_COST_USD: ${MAX_RUN_COST_USD:-15.00}
  CORS_ORIGINS: http://localhost:3000
  # The OAuth client the Sources screen's "Continue with Google" uses. Unset
  # locally means the button says so rather than opening a dead consent screen.
  GOOGLE_ADS_OAUTH_CLIENT_ID: ${GOOGLE_ADS_OAUTH_CLIENT_ID:-}
  GOOGLE_ADS_OAUTH_CLIENT_SECRET: ${GOOGLE_ADS_OAUTH_CLIENT_SECRET:-}
  # The source keys, when the deployment supplies them rather than the Sources
  # screen. This list is an allow-list — a variable absent from here never
  # reaches the container, however carefully it was set in `.env`. A workspace
  # credential still overrides whatever is set (`credentials.resolve_secret`).
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  DATAFORSEO_API_KEY: ${DATAFORSEO_API_KEY:-}
  WEBSHARE_API_KEY: ${WEBSHARE_API_KEY:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: ["uvicorn", "agent.main:app", "--reload", "--reload-dir", "/app/src", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *api-env
      PORT: 8000
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/alembic:/app/alembic
      - ./apps/api/alembic.ini:/app/alembic.ini
      - ./apps/api/scripts:/app/scripts
      - ./apps/api/tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    # No `ports:` — api has no public ingress here, exactly as on Railway.

  worker:
    build:
      # The repo root, matching Railway: the worker's Dockerfile lives there so
      # plain auto-detection finds it (see the header of `Dockerfile`).
      context: .
      dockerfile: Dockerfile
    command: ["arq", "agent.worker.WorkerSettings"]
    environment:
      <<: *api-env
    volumes:
      - storage:/data
      - ./apps/api/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    # `expose`, not `ports`: 8081 is the internal file server (PRD §5.1), which
    # `api` reaches over the compose network at WORKER_INTERNAL_URL. Publishing
    # it to the host would break the "only web publishes a port" rule that makes
    # this file a faithful mirror of Railway.
    expose:
      - "8081"

  # `docker compose run --rm test` — the integration suite, on the same private
  # network as everything else. Profiled, so `make up` never starts it, and
  # unpublished, so the "only web publishes a host port" rule still holds.
  test:
    profiles: ["test"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: dev
    environment:
      <<: *api-env
      # Its own database. The suite truncates between tests and must never be
      # pointed at the one `make up` gave you.
      DATABASE_URL: postgresql://agent:agent@postgres:5432/agent_test
      REDIS_URL: redis://redis:6379/15
      COOKIE_SECURE: "false"
      BOOTSTRAP_ADMIN_EMAIL: ""
      BOOTSTRAP_ADMIN_PASSWORD: ""
      # Blanked for the same reason as the bootstrap admin: `<<: *api-env` pulls
      # whatever is in `.env`, and a suite that can see a real key stops testing
      # the unconfigured path. `test_models_api` asserts a 409 when nothing
      # supplies OpenRouter — with a live key inherited here it got a 200.
      OPENROUTER_API_KEY: ""
      DATAFORSEO_API_KEY: ""
      WEBSHARE_API_KEY: ""
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/tests:/app/tests
      - ./apps/api/alembic:/app/alembic
      - ./apps/api/alembic.ini:/app/alembic.ini
      - ./apps/api/scripts:/app/scripts
      - ./apps/api/pyproject.toml:/app/pyproject.toml  # pytest settings live here
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    command: ["pytest", "tests/integration", "-q"]

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: deps
    command: ["pnpm", "dev", "--port", "3000", "--hostname", "::"]
    environment:
      PORT: 3000
      API_INTERNAL_URL: http://api:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  storage:
  web_node_modules:
  web_next:

networks:
  internal:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.31.240.0/24
        - subnet: fd00:ada:1::/64
