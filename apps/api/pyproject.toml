[project]
name = "ads-research-agent-api"
version = "0.1.0"
description = "Paid Ads Research Agent — API and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.6",          # HTTP framework (PRD stack)
    "uvicorn[standard]>=0.34.0", # ASGI server
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",           # async Postgres driver
    "alembic>=1.14.0",           # migrations (preDeployCommand)
    "pydantic-settings>=2.7.0",  # typed env config
    "arq>=0.26.3",               # job queue on Redis
    "redis>=5.2.1",              # imported directly by the health check
    "cryptography>=44.0.0",      # AES-256-GCM secret vault
    "argon2-cffi>=23.1.0",       # Argon2id password hashing (used in P0b)
    "httpx>=0.28.1",             # outbound HTTP (OpenRouter, connectors)
    "structlog>=24.4.0",         # structured logging
    "pgvector>=0.3.6",           # SQLAlchemy Vector column type
    "email-validator>=2.2.0",    # pydantic EmailStr; invites are addressed by email (PRD §6.1.6)
    "aiosmtplib>=3.0.2",         # async SMTP; invite delivery when SMTP_HOST is set (PRD §19.1.12)
    "fastembed>=0.5.1",   # local embeddings; OpenRouter serves no embedding model (PRD §20 Q6)
    "selectolax>=0.3.21", # HTML parsing for the site crawler (PRD §9.4)
    "playwright>=1.49.0", # Transparency Center connector (PRD §9.2). Dockerfile.worker runs
    # `playwright install` from THIS venv, so the browser builds always match whatever this
    # floor resolves to — the base image's own browsers do not, and relying on them is what
    # silently removed competitor creative from every report.
    "python-multipart>=0.0.20",  # FastAPI multipart parsing for the CSV upload (PRD §14)
    "jinja2>=3.1.5",      # the deterministic report templates (PRD §11) — markdown and print HTML
    "weasyprint>=63.1",   # PDF via HTML+CSS Paged Media (PRD §12). Imported lazily: it needs
    # pango/cairo, which only the worker image carries.
    "python-docx>=1.1.2", # DOCX with real Heading styles so Word's TOC field works (PRD §12)
    "openpyxl>=3.1.5",    # the media plan as a workbook with LIVE formulas (Stage 02 PRD §14):
    # finance edits the envelope and every dependent cell moves, with no
    # recalculation by us. `xlsxwriter` cannot read a file back, which the
    # export tests need in order to assert on a formula rather than a value.
    "pypdf>=5.1.0",       # reads the PDFs a person uploads as business context. `weasyprint`
    # only writes them; nothing in the image could read one before this.
    "pandas>=2.2.3",             # PRD §18 law 3: every CPA/ROAS/P&L figure is computed here, never by a model
    "pyyaml>=6.0.2",      # reads planning_constants.yaml at startup (PRD §9.3). Was a dev-only
    # dependency while only tests parsed YAML; law 15 makes it a runtime one.
    "tzdata>=2025.2",     # the IANA database for `zoneinfo`. The worker image (Playwright/jammy)
    # ships no /usr/share/zoneinfo, so without this EVERY schedule is
    # disabled on its first poll — `ZoneInfo("UTC")` itself raises.
    "snowballstemmer>=3.0.1",
    "simplemma>=1.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "mypy>=1.14.0",
    "ruff>=0.8.4",
    "types-pyyaml>=6.0.12",
    "vcrpy>=6.0.2",    # connector cassettes (PRD §9); replayed with record_mode=none
    "pandas-stubs>=2.2.3",  # mypy strict has no types for pandas otherwise, and `frames.py` is where the arithmetic lives
    "types-openpyxl>=3.1.5", # the workbook builder writes cell formulas as strings; strict mode has to see the Cell API
    "pytest-cov>=6.0.0",  # PRD §15 NF9 sets a coverage floor; `make coverage` is what measures it
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["agent"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "arq.*", "fastembed.*", "selectolax.*", "vcr.*", "weasyprint.*", "docx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# python-docx ships a py.typed marker but leaves parts of its own API
# unannotated (Table.add_row among them), so strict mode refuses to call them.
# The module is still fully type-checked; exactly one rule is relaxed, and only
# in the one module that touches those calls.
module = ["agent.export.docx"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
# One event loop for the whole session. The engine and the Redis pool are
# process-level caches, so per-test loops would leave every connection bound to
# a loop that has already closed.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
