# Stage 04 constants (PRD §9.5, law 25). Every value carries `value`, `source`
# and `reviewed_at`; a missing `source` fails startup naming the key, and
# `version` is stamped on every CreativeInput and package.
#
# Google character limits, asset counts, ratios, pixel minimums and file-size
# caps are NOT here — they come from the pinned RuleSet.asset_specs (Stage 03
# §9.6). A surface the spec sheet lacks is `spec_missing`, never a guess.
#
# One entry per line, on purpose: `tests/creative/test_creative_constants.py`
# strips a `source` by line to prove startup names the key.
version: "2026.09.1"
